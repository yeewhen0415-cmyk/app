<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極致全方位記帳本（防遺失升級版）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 selection:bg-emerald-500 selection:text-white">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-wallet text-slate-950 text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-tight leading-none">極致記帳本</h1>
                    <span id="streakBadge" class="text-[10px] text-emerald-400 font-medium">🔥 連續記帳 0 天</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <!-- 隱私遮罩按鈕 -->
                <button onclick="togglePrivacy()" id="privacyBtn" class="w-9 h-9 rounded-xl bg-slate-800/80 text-slate-300 flex items-center justify-center hover:bg-slate-700 transition" title="隱私防窺模式">
                    <i class="fa-solid fa-eye text-sm"></i>
                </button>
                <!-- 設定 / 資料備份按鈕 -->
                <button onclick="openSettingsModal()" class="w-9 h-9 rounded-xl bg-slate-800/80 text-slate-300 flex items-center justify-center hover:bg-slate-700 transition" title="備份與設定">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <!-- 資料防遺失救援提示橫幅 -->
        <div id="rescueBanner" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 flex items-center justify-between text-xs text-amber-300">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-triangle-exclamation text-amber-400 text-base"></i>
                <span>發現瀏覽器曾儲存過資料，是否立即恢復？</span>
            </div>
            <button onclick="restoreFromBackup()" class="bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl hover:opacity-90">一鍵還原</button>
        </div>

        <!-- 總覽儀表板卡片 -->
        <section class="bg-gradient-to-br from-slate-900 to-slate-900/60 border border-slate-800/80 rounded-3xl p-5 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex justify-between items-start mb-3">
                <div>
                    <span class="text-xs font-medium text-slate-400">今日剩餘預算</span>
                    <h2 class="text-3xl font-extrabold tracking-tight mt-0.5 text-emerald-400 privacy-val" id="dashRemaining">$150</h2>
                </div>
                <button onclick="checkNoSpendDay()" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1.5 rounded-full font-medium transition flex items-center space-x-1">
                    <i class="fa-solid fa-face-smile"></i>
                    <span>今天沒花錢</span>
                </button>
            </div>

            <!-- 進度條 -->
            <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden mb-4">
                <div id="dashProgressBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full transition-all duration-500" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-3 gap-2 pt-3 border-t border-slate-800/60 text-xs">
                <div>
                    <span class="text-slate-400 block mb-0.5">目前總餘額</span>
                    <span class="text-sm font-bold text-sky-400 privacy-val" id="dashTotalBalance">$0</span>
                </div>
                <div>
                    <span class="text-slate-400 block mb-0.5">今日已花費</span>
                    <span class="text-sm font-bold text-slate-200 privacy-val" id="dashTodaySpent">$0</span>
                </div>
                <div>
                    <span class="text-slate-400 block mb-0.5">每日總額度</span>
                    <span class="text-sm font-bold text-slate-200 privacy-val" id="dashDailyLimit">$150</span>
                </div>
            </div>
        </section>

        <!-- 分頁切換列 -->
        <div class="flex bg-slate-900/90 p-1 rounded-2xl border border-slate-800 text-xs font-semibold">
            <button onclick="switchTab('record')" id="tabBtn-record" class="flex-1 py-2.5 rounded-xl transition bg-emerald-500 text-slate-950 shadow-md">記帳明細</button>
            <button onclick="switchTab('calendar')" id="tabBtn-calendar" class="flex-1 py-2.5 rounded-xl transition text-slate-400 hover:text-white">月曆檢視</button>
            <button onclick="switchTab('charts')" id="tabBtn-charts" class="flex-1 py-2.5 rounded-xl transition text-slate-400 hover:text-white">圖表分析</button>
            <button onclick="switchTab('vip')" id="tabBtn-vip" class="flex-1 py-2.5 rounded-xl transition text-slate-400 hover:text-white">VIP 總覽</button>
        </div>

        <!-- 區塊 1：記帳與清單頁面 -->
        <div id="tabContent-record" class="space-y-4">
            <!-- 新增記帳表單卡片 -->
            <section class="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-lg">
                <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-pen-nib text-emerald-400"></i>
                    <span>快速記帳</span>
                </h3>

                <!-- 收支類型切換 -->
                <div class="grid grid-cols-3 gap-2 mb-3 bg-slate-950 p-1 rounded-xl border border-slate-800/60 text-xs font-medium">
                    <button type="button" onclick="setType('expense')" id="typeExpense" class="py-2 rounded-lg transition bg-rose-500/20 text-rose-400 border border-rose-500/30">支出</button>
                    <button type="button" onclick="setType('income')" id="typeIncome" class="py-2 rounded-lg transition text-slate-400">收入</button>
                    <button type="button" onclick="setType('transfer')" id="typeTransfer" class="py-2 rounded-lg transition text-slate-400">轉帳</button>
                </div>

                <form id="recordForm" onsubmit="addRecord(event)" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1 font-medium">日期（可自由調整）</label>
                            <input type="date" id="inputDate" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-400 mb-1 font-medium">分類</label>
                            <select id="inputCategory" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                                <!-- 動態生成 -->
                            </select>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-[11px] text-slate-400 font-medium">金額（可直接輸入算式）</label>
                            <!-- 常用金額快捷按鈕 -->
                            <div class="flex space-x-1">
                                <button type="button" onclick="addQuickAmount(50)" class="bg-slate-800 hover:bg-slate-700 text-[10px] px-1.5 py-0.5 rounded text-slate-300">+50</button>
                                <button type="button" onclick="addQuickAmount(100)" class="bg-slate-800 hover:bg-slate-700 text-[10px] px-1.5 py-0.5 rounded text-slate-300">+100</button>
                                <button type="button" onclick="addQuickAmount(500)" class="bg-slate-800 hover:bg-slate-700 text-[10px] px-1.5 py-0.5 rounded text-slate-300">+500</button>
                            </div>
                        </div>
                        <input type="text" id="inputPrice" placeholder="例: 120 或 50+80" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 font-bold">
                    </div>

                    <!-- 消費心理評價 -->
                    <div id="moodContainer">
                        <label class="block text-[11px] text-slate-400 mb-1 font-medium">消費價值評估</label>
                        <div class="grid grid-cols-3 gap-2 text-xs">
                            <label class="cursor-pointer bg-slate-950 border border-slate-800 rounded-xl p-2 text-center hover:border-emerald-500 transition flex items-center justify-center space-x-1">
                                <input type="radio" name="mood" value="必要" checked class="accent-emerald-500">
                                <span>🛡️ 必要</span>
                            </label>
                            <label class="cursor-pointer bg-slate-950 border border-slate-800 rounded-xl p-2 text-center hover:border-emerald-500 transition flex items-center justify-center space-x-1">
                                <input type="radio" name="mood" value="開心" class="accent-emerald-500">
                                <span>✨ 開心</span>
                            </label>
                            <label class="cursor-pointer bg-slate-950 border border-slate-800 rounded-xl p-2 text-center hover:border-emerald-500 transition flex items-center justify-center space-x-1">
                                <input type="radio" name="mood" value="後悔" class="accent-emerald-500">
                                <span>💧 後悔</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1 font-medium">備註 / 品項名稱</label>
                        <input type="text" id="inputNote" placeholder="例如：午餐吃排骨飯" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/20 hover:opacity-90 transition text-xs tracking-wide">
                        確認記帳
                    </button>
                </form>
            </section>

            <!-- 歷史紀錄清單卡片 -->
            <section class="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-lg space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-bold text-slate-300">近期收支明細（可修改日期）</h3>
                    <!-- 搜尋框 -->
                    <div class="relative w-36">
                        <input type="text" id="searchKeyword" oninput="renderRecords()" placeholder="搜尋備註..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-[11px] text-slate-200 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div id="recordList" class="space-y-2 max-h-80 overflow-y-auto hide-scrollbar">
                    <!-- 動態載入紀錄 -->
                </div>
            </section>
        </div>

        <!-- 區塊 2：月曆視圖 -->
        <div id="tabContent-calendar" class="space-y-4 hidden">
            <section class="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:bg-slate-700"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                    <h3 id="calMonthTitle" class="text-sm font-bold text-slate-200">2026年 4月</h3>
                    <button onclick="changeMonth(1)" class="w-8 h-8 rounded-xl bg-slate-800 flex items-center justify-center text-slate-300 hover:bg-slate-700"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                </div>
                <!-- 星期標題 -->
                <div class="grid grid-cols-7 text-center text-[10px] font-medium text-slate-400 mb-2">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                </div>
                <!-- 月曆格子 -->
                <div id="calGrid" class="grid grid-cols-7 gap-1 text-center text-xs">
                    <!-- 動態生成 -->
                </div>
            </section>

            <!-- 選中日期的明細 -->
            <section class="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-lg">
                <h3 id="selectedDateTitle" class="text-xs font-bold text-slate-400 mb-3">請點選上方月曆日期查看明細</h3>
                <div id="selectedDateList" class="space-y-2 max-h-48 overflow-y-auto hide-scrollbar">
                    <p class="text-xs text-slate-500 text-center py-4">無任何支出紀錄</p>
                </div>
            </section>
        </div>

        <!-- 區塊 3：圖表分析 -->
        <div id="tabContent-charts" class="space-y-4 hidden">
            <section class="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-300">本月支出類別占比</h3>
                    <button onclick="exportChartImage('pieChart', 'expense_pie.png')" class="text-[11px] text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-lg hover:bg-emerald-500/20"><i class="fa-solid fa-download"></i> 下載圖表</button>
                </div>
                <div class="relative h-64 flex items-center justify-center">
                    <canvas id="pieChart"></canvas>
                </div>
            </section>

            <section class="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-300">近 7 天支出趨勢</h3>
                    <button onclick="exportChartImage('barChart', 'expense_bar.png')" class="text-[11px] text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-lg hover:bg-emerald-500/20"><i class="fa-solid fa-download"></i> 下載圖表</button>
                </div>
                <div class="relative h-56 flex items-center justify-center">
                    <canvas id="barChart"></canvas>
                </div>
            </section>
        </div>

        <!-- 區塊 4：VIP 深度財務分析 -->
        <div id="tabContent-vip" class="space-y-4 hidden">
            <section class="bg-gradient-to-br from-indigo-950/40 via-slate-900 to-slate-900 border border-indigo-500/30 rounded-3xl p-5 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
                <div class="flex items-center space-x-2 mb-4">
                    <span class="bg-indigo-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded uppercase">VIP ANALYTICS</span>
                    <h3 class="text-sm font-bold text-slate-200">全方位財務健康看板</h3>
                </div>

                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-2xl">
                        <span class="text-slate-400 block mb-1">週支出平均</span>
                        <span class="text-lg font-bold text-teal-400 privacy-val" id="vipWeeklyAvg">$0</span>
                    </div>
                    <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-2xl">
                        <span class="text-slate-400 block mb-1">月支出平均</span>
                        <span class="text-lg font-bold text-emerald-400 privacy-val" id="vipMonthlyAvg">$0</span>
                    </div>
                    <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-2xl">
                        <span class="text-slate-400 block mb-1">平均每日開銷</span>
                        <span class="text-lg font-bold text-rose-400 privacy-val" id="vipAvgSpent">$0</span>
                    </div>
                    <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-2xl">
                        <span class="text-slate-400 block mb-1">衝動後悔次數</span>
                        <span class="text-lg font-bold text-amber-400" id="vipRegretCount">0 次</span>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <!-- 設定 / 備份彈跳視窗 -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-200">資料備份與參數設定</h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">每日預算上限 ($)</label>
                    <input type="number" id="settingDailyLimit" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                
                <div class="pt-2 border-t border-slate-800 flex space-x-2">
                    <button onclick="saveSettings()" class="flex-1 bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl hover:opacity-90">儲存設定</button>
                </div>

                <div class="pt-2 border-t border-slate-800 space-y-2">
                    <span class="text-slate-400 block font-medium">資料庫管理（強效防遺失）</span>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="exportDataJSON()" class="bg-slate-800 text-slate-300 py-2 rounded-xl hover:bg-slate-700">下載備份 JSON</button>
                        <label class="bg-slate-800 text-slate-300 py-2 rounded-xl hover:bg-slate-700 text-center cursor-pointer">
                            匯入備份 JSON
                            <input type="file" id="importFile" onchange="importDataJSON(event)" accept=".json" class="hidden">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 核心邏輯 -->
    <script>
        // 資料結構初始化（雙重防護：同時儲存於 localStorage 與 sessionStorage）
        let records = JSON.parse(localStorage.getItem('my_records')) || JSON.parse(sessionStorage.getItem('backup_records')) || [];
        let config = JSON.parse(localStorage.getItem('my_config')) || { daily_limit: 150 };
        let currentType = 'expense';
        let currentCalYear = new Date().getFullYear();
        let currentCalMonth = new Date().getMonth();
        let selectedCalDateStr = '';
        let isPrivacyMode = false;

        const categories = {
            expense: ['🍔 飲食', '🚗 交通', '🛍️ 購物', '🎉 娛樂', '🧾 帳單', '📦 其他'],
            income: ['💰 薪資', '🧧 紅包', '📈 投資', '💼 其他收入'],
            transfer: ['🏦 銀行轉帳', '💵 提領現金', '💳 信用卡繳款']
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('inputDate').value = getTodayStr();
            updateCategoryOptions();
            checkRescueData();
            renderUI();
        });

        // 檢查是否有歷史殘存資料可供救援
        function checkRescueData() {
            const local = localStorage.getItem('my_records');
            const session = sessionStorage.getItem('backup_records');
            if (!local && session) {
                document.getElementById('rescueBanner').classList.remove('hidden');
            }
        }

        function restoreFromBackup() {
            const session = sessionStorage.getItem('backup_records');
            if (session) {
                records = JSON.parse(session);
                saveAndRender();
                document.getElementById('rescueBanner').classList.add('hidden');
                alert('成功救回先前遺失的資料！');
            }
        }

        function getTodayStr() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 切換收支類型
        function setType(type) {
            currentType = type;
            document.getElementById('typeExpense').className = type === 'expense' ? 'py-2 rounded-lg transition bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold' : 'py-2 rounded-lg transition text-slate-400';
            document.getElementById('typeIncome').className = type === 'income' ? 'py-2 rounded-lg transition bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold' : 'py-2 rounded-lg transition text-slate-400';
            document.getElementById('typeTransfer').className = type === 'transfer' ? 'py-2 rounded-lg transition bg-sky-500/20 text-sky-400 border border-sky-500/30 font-bold' : 'py-2 rounded-lg transition text-slate-400';
            
            document.getElementById('moodContainer').style.display = type === 'expense' ? 'block' : 'none';
            updateCategoryOptions();
        }

        function updateCategoryOptions() {
            const select = document.getElementById('inputCategory');
            select.innerHTML = '';
            categories[currentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        // 常用金額快捷按鈕
        function addQuickAmount(val) {
            const priceInput = document.getElementById('inputPrice');
            let currentVal = parseFloat(priceInput.value) || 0;
            priceInput.value = currentVal + val;
        }

        // 新增記帳
        function addRecord(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const category = document.getElementById('inputCategory').value;
            const rawPrice = document.getElementById('inputPrice').value;
            const note = document.getElementById('inputNote').value || (currentType === 'expense' ? '一般支出' : '收入');
            const mood = currentType === 'expense' ? document.querySelector('input[name="mood"]:checked').value : '無';

            // 支援內嵌算式計算
            let price = 0;
            try {
                price = eval(rawPrice);
            } catch {
                alert('金額格式有誤，請輸入有效數字或算式');
                return;
            }

            if (isNaN(price) || price <= 0) {
                alert('請輸入大於 0 的金額');
                return;
            }

            const newRecord = {
                id: Date.now(),
                date,
                type: currentType,
                category,
                price,
                mood,
                note
            };

            records.unshift(newRecord);
            saveAndRender();

            // 清空欄位
            document.getElementById('inputPrice').value = '';
            document.getElementById('inputNote').value = '';
        }

        // 隨時更改既有記錄的日期
        function updateRecordDate(id, newDate) {
            if (!newDate) return;
            const record = records.find(r => r.id === id);
            if (record) {
                record.date = newDate;
                saveAndRender();
            }
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('my_records', JSON.stringify(records));
            sessionStorage.setItem('backup_records', JSON.stringify(records)); // 雙重安全備份
            localStorage.setItem('my_config', JSON.stringify(config));
            renderUI();
        }

        // 渲染整體介面
        function renderUI() {
            renderDashboard();
            renderRecords();
            renderCalendar();
            renderCharts();
            renderVIP();
            updateStreak();
        }

        // 儀表板計算（含總餘額計算）
        function renderDashboard() {
            const todayStr = getTodayStr();
            const todayRecords = records.filter(r => r.date === todayStr);
            const todaySpent = todayRecords.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.price, 0);
            
            // 計算總餘額：所有收入總和 - 所有支出總和
            const totalIncome = records.filter(r => r.type === 'income').reduce((sum, r) => sum + r.price, 0);
            const totalExpense = records.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.price, 0);
            const totalBalance = totalIncome - totalExpense;

            const dailyLimit = parseFloat(config.daily_limit) || 150;
            const remaining = dailyLimit - todaySpent;
            const usagePct = Math.min(100, Math.max(0, (todaySpent / dailyLimit) * 100));

            document.getElementById('dashRemaining').textContent = `$${remaining}`;
            document.getElementById('dashTotalBalance').textContent = `$${totalBalance}`;
            document.getElementById('dashTodaySpent').textContent = `$${todaySpent}`;
            document.getElementById('dashDailyLimit').textContent = `$${dailyLimit}`;
            document.getElementById('dashProgressBar').style.width = `${usagePct}%`;
            applyPrivacyMask();
        }

        // 記帳紀錄清單與搜尋
        function renderRecords() {
            const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
            const listEl = document.getElementById('recordList');
            listEl.innerHTML = '';

            const filtered = records.filter(r => r.note.toLowerCase().includes(keyword) || r.category.includes(keyword));

            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">沒有找到相關紀錄</p>`;
                return;
            }

            filtered.forEach(r => {
                let colorClass = 'text-rose-400';
                let sign = '-';
                if (r.type === 'income') { colorClass = 'text-emerald-400'; sign = '+'; }
                if (r.type === 'transfer') { colorClass = 'text-sky-400'; sign = '⇄'; }

                const item = document.createElement('div');
                item.className = 'bg-slate-950/60 border border-slate-800/80 rounded-2xl p-3 flex flex-col space-y-2 text-xs';
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="space-y-0.5">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-slate-200">${r.category}</span>
                                ${r.mood && r.mood !== '無' ? `<span class="text-[10px] bg-slate-900 px-1.5 py-0.2 rounded text-slate-400">${r.mood}</span>` : ''}
                            </div>
                            <p class="text-slate-400 text-[11px]">${r.note}</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="font-bold ${colorClass} privacy-val">${sign}$${r.price}</span>
                            <button onclick="deleteRecord(${r.id})" class="text-slate-600 hover:text-rose-400 transition" title="刪除紀錄"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <!-- 移動日期控制列 -->
                    <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-[11px] text-slate-400">
                        <span>流動日期：</span>
                        <input type="date" value="${r.date}" onchange="updateRecordDate(${r.id}, this.value)" class="bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-[11px] text-slate-300 focus:outline-none focus:border-emerald-500">
                    </div>
                `;
                listEl.appendChild(item);
            });
            applyPrivacyMask();
        }

        // 連續記帳天數統計
        function updateStreak() {
            let uniqueDates = [...new Set(records.map(r => r.date))].sort().reverse();
            let streak = 0;
            let checkDate = new Date();

            for (let i = 0; i < 30; i++) {
                const dateStr = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
                if (uniqueDates.includes(dateStr)) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else if (i === 0) {
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
            document.getElementById('streakBadge').textContent = `🔥 連續記帳 ${streak} 天`;
        }

        // 一鍵今天沒花錢打卡
        function checkNoSpendDay() {
            const todayStr = getTodayStr();
            const existing = records.find(r => r.date === todayStr && r.note === '✨ 今日無開銷打卡');
            if (existing) {
                alert('今天已經打卡過囉！');
                return;
            }
            records.unshift({
                id: Date.now(),
                date: todayStr,
                type: 'expense',
                category: '🎉 娛樂',
                price: 0,
                mood: '開心',
                note: '✨ 今日無開銷打卡'
            });
            saveAndRender();
            alert('太棒了！成功記錄無開銷日！');
        }

        // 防窺隱私遮罩
        function togglePrivacy() {
            isPrivacyMode = !isPrivacyMode;
            const btn = document.getElementById('privacyBtn');
            btn.innerHTML = isPrivacyMode ? '<i class="fa-solid fa-eye-slash text-sm text-emerald-400"></i>' : '<i class="fa-solid fa-eye text-sm"></i>';
            applyPrivacyMask();
        }

        function applyPrivacyMask() {
            document.querySelectorAll('.privacy-val').forEach(el => {
                if (isPrivacyMode) {
                    if (!el.dataset.original) el.dataset.original = el.textContent;
                    el.textContent = '****';
                } else {
                    if (el.dataset.original) el.textContent = el.dataset.original;
                }
            });
        }

        // 分頁切換
        function switchTab(tab) {
            ['record', 'calendar', 'charts', 'vip'].forEach(t => {
                document.getElementById(`tabContent-${t}`).classList.add('hidden');
                document.getElementById(`tabBtn-${t}`).className = 'flex-1 py-2.5 rounded-xl transition text-slate-400 hover:text-white';
            });
            document.getElementById(`tabContent-${tab}`).classList.remove('hidden');
            document.getElementById(`tabBtn-${tab}`).className = 'flex-1 py-2.5 rounded-xl transition bg-emerald-500 text-slate-950 shadow-md font-bold';
        }

        // 月曆生成
        function changeMonth(dir) {
            currentCalMonth += dir;
            if (currentCalMonth > 11) { currentCalMonth = 0; currentCalYear++; }
            if (currentCalMonth < 0) { currentCalMonth = 11; currentCalYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('calMonthTitle').textContent = `${currentCalYear}年 ${currentCalMonth + 1}月`;
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';

            const firstDay = new Date(currentCalYear, currentCalMonth, 1).getDay();
            const daysInMonth = new Date(currentCalYear, currentCalMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentCalYear}-${String(currentCalMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayRecords = records.filter(r => r.date === dateStr);
                const hasExpense = dayRecords.some(r => r.type === 'expense');
                const hasIncome = dayRecords.some(r => r.type === 'income');

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `h-9 rounded-xl flex flex-col items-center justify-center text-xs transition relative ${dateStr === selectedCalDateStr ? 'bg-emerald-500/20 border border-emerald-500 text-white font-bold' : 'hover:bg-slate-800 text-slate-300'}`;
                btn.onclick = () => selectCalDate(dateStr);
                
                let dotHtml = '';
                if (hasExpense) dotHtml += '<span class="w-1 h-1 bg-rose-400 rounded-full inline-block mx-0.5"></span>';
                if (hasIncome) dotHtml += '<span class="w-1 h-1 bg-emerald-400 rounded-full inline-block mx-0.5"></span>';

                btn.innerHTML = `<span>${day}</span><div class="flex items-center h-1">${dotHtml}</div>`;
                grid.appendChild(btn);
            }
        }

        function selectCalDate(dateStr) {
            selectedCalDateStr = dateStr;
            renderCalendar();
            const title = document.getElementById('selectedDateTitle');
            const list = document.getElementById('selectedDateList');
            title.textContent = `${dateStr} 明細紀錄`;
            list.innerHTML = '';

            const dayRecords = records.filter(r => r.date === dateStr);
            if (dayRecords.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">當日無記帳紀錄</p>`;
                return;
            }

            dayRecords.forEach(r => {
                const div = document.createElement('div');
                div.className = 'bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5 flex justify-between items-center text-xs';
                div.innerHTML = `<span>${r.category} - ${r.note}</span><span class="font-bold text-rose-400 privacy-val">$${r.price}</span>`;
                list.appendChild(div);
            });
            applyPrivacyMask();
        }

        // Chart.js 圖表渲染
        let pieChartInstance = null;
        let barChartInstance = null;

        function renderCharts() {
            const expenseRecords = records.filter(r => r.type === 'expense');
            const catMap = {};
            expenseRecords.forEach(r => {
                catMap[r.category] = (catMap[r.category] || 0) + r.price;
            });

            const pieCtx = document.getElementById('pieChart').getContext('2d');
            if (pieChartInstance) pieChartInstance.destroy();
            pieChartInstance = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{
                        data: Object.values(catMap),
                        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { size: 10 } } } } }
            });

            const days = [];
            const amounts = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                days.push(dStr.slice(5));
                const sum = records.filter(r => r.date === dStr && r.type === 'expense').reduce((acc, r) => acc + r.price, 0);
                amounts.push(sum);
            }

            const barCtx = document.getElementById('barChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: days,
                    datasets: [{
                        label: '每日支出',
                        data: amounts,
                        backgroundColor: '#10b981',
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#94a3b8', font: { size: 10 } } }, y: { ticks: { color: '#94a3b8', font: { size: 10 } } } } }
            });
        }

        // 下載圖表圖片
        function exportChartImage(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // VIP 看板
        function renderVIP() {
            const expenseRecords = records.filter(r => r.type === 'expense');
            const totalExp = expenseRecords.reduce((sum, r) => sum + r.price, 0);
            const uniqueDays = new Set(records.map(r => r.date)).size;
            
            const weeklyAvg = uniqueDays > 0 ? Math.round(totalExp / Math.max(1, (uniqueDays / 7))) : 0;
            const uniqueMonths = new Set(expenseRecords.map(r => r.date.slice(0, 7))).size;
            const monthlyAvg = uniqueMonths > 0 ? Math.round(totalExp / uniqueMonths) : 0;

            document.getElementById('vipWeeklyAvg').textContent = `$${weeklyAvg}`;
            document.getElementById('vipMonthlyAvg').textContent = `$${monthlyAvg}`;
            
            const avg = uniqueDays > 0 ? Math.round(totalExp / uniqueDays) : 0;
            document.getElementById('vipAvgSpent').textContent = `$${avg}`;

            const regretCount = records.filter(r => r.mood === '後悔').length;
            document.getElementById('vipRegretCount').textContent = `${regretCount} 次`;
        }

        // 設定與備份彈窗
        function openSettingsModal() {
            document.getElementById('settingDailyLimit').value = config.daily_limit;
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }
        function saveSettings() {
            const limit = parseFloat(document.getElementById('settingDailyLimit').value);
            if (!isNaN(limit)) {
                config.daily_limit = limit;
                localStorage.setItem('my_config', JSON.stringify(config));
                renderUI();
                closeSettingsModal();
                alert('設定已儲存！');
            }
        }

        // JSON 匯出與匯入
        function exportDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ records, config }));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `my_accounting_backup_${getTodayStr()}.json`);
            dlAnchor.click();
        }

        function importDataJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsed = JSON.parse(event.target.result);
                    if (parsed.records) records = parsed.records;
                    if (parsed.config) config = parsed.config;
                    saveAndRender();
                    alert('資料匯入成功！');
                    closeSettingsModal();
                } catch {
                    alert('檔案格式錯誤，無法匯入');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
